name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - run: npm ci
      - name: Authenticate to Google Cloud for OSS Exit Gate
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          token_format: 'access_token'
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Stage to Artifact Registry and trigger OSS Exit Gate
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          cat << 'NPMRC' > "$HOME/.npmrc"
          registry=https://us-npm.pkg.dev/oss-exit-gate-prod/cloud-run-mcp--npm/
          //us-npm.pkg.dev/oss-exit-gate-prod/cloud-run-mcp--npm/:always-auth=true
          //us-npm.pkg.dev/oss-exit-gate-prod/cloud-run-mcp--npm/:_authToken=${ACCESS_TOKEN}
          NPMRC
          trap 'rm -f "$HOME/.npmrc"' EXIT
          npm publish --access public --registry="https://us-npm.pkg.dev/oss-exit-gate-prod/cloud-run-mcp--npm/"
          cat << 'MANIFEST' > manifest.json
          {
            "publish_all": true
          }
          MANIFEST
          gcloud storage cp manifest.json "gs://oss-exit-gate-prod-projects-bucket/cloud-run-mcp/npm/manifests/manifest-${RUN_ID}-${RUN_ATTEMPT}.json"
